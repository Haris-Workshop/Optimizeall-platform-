# Shared by the page locations (@document through the server renderer, @document_api straight from the API), after
# proxy-api.conf. Each location adds its own error_page for 502/504 (renderer down → API; API down → app shell) and
# includes security-headers.conf itself (snippets include no other files: scripts/serve-web-nginx.sh rewrites the
# include paths of the main configuration only).
ssi on;
# The API's validators describe its HTML without the shell; after a web deploy the same page embeds new asset
# names, so a 304 would revive a page pointing at deleted bundles. Pages are therefore always sent in full
# (SSI drops Last-Modified; ETag is hidden and conditional headers are not forwarded).
proxy_hide_header ETag;
proxy_set_header If-None-Match "";
proxy_set_header If-Modified-Since "";
# A page is always HTML. The API answers /_document with an HTML page for 200/301/404/410, but other statuses
# can be JSON (429 from its rate limiter, 500 problem+json, 400/405 from routing) or come from nginx itself
# (502/504, API down), and a non-HTML body on a page URL makes browsers (iOS Safari) offer it as a download.
# Those are replaced by the app shell (HTML, 503 + Retry-After) so the React app boots and retries. (The server
# renderer passes the API's statuses through and answers 503 itself when the API is unreachable.)
proxy_intercept_errors on;
# @document_api is itself reached through error_page (the renderer was down): its own error pages must still apply.
recursive_error_pages on;
error_page 400 401 403 405 408 413 429 500 501 503 =503 @shell;
# The API's own headers are for JSON; the page gets the web app's security headers instead.
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header Strict-Transport-Security;
