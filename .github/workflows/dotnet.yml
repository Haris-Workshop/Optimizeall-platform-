# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
#
# Quick .NET build + test of the API on every push/PR to this branch. The solution lives in backend/; integration tests
# run on SQLite here (no database service needed). The full pipeline — MySQL integration tests, frontend and E2E — is
# ci.yml.

name: .NET

on:
  push:
    branches: [ "claude/optimize-all-platform-i3j5id" ]
  pull_request:
    branches: [ "claude/optimize-all-platform-i3j5id" ]

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore OptimizeAll.sln
    - name: Build
      run: dotnet build OptimizeAll.sln --no-restore
    # The test projects run one after another: in parallel the integration hosts and the unit tests compete for the
    # runner's memory, and integration requests then fail at random with transport errors.
    - name: Unit tests
      run: dotnet test tests/OptimizeAll.UnitTests --no-build --verbosity normal
    - name: Integration tests
      run: dotnet test tests/OptimizeAll.IntegrationTests --no-build --verbosity normal
      env:
        OPTIMIZEALL_TEST_PROVIDER: Sqlite
