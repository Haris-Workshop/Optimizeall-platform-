# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
#
# Quick .NET build + test after production-branch pushes that touch the backend. The solution lives in backend/;
# integration tests run on SQLite here (no database service needed). Pull requests use ci.yml's more complete MySQL +
# SQLite matrix, so duplicating this workflow there only wastes runner time.

name: .NET

on:
  push:
    branches: [ "claude/optimize-all-platform-i3j5id" ]
    # Documentation, frontend and policy-only commits cannot affect the .NET solution.
    paths:
      - "backend/**"
      - "global.json"
      - "scripts/export-openapi.sh"
      - "scripts/regenerate-migrations.sh"
      - "scripts/upgrade-baseline-mysql.sh"
      - ".github/workflows/dotnet.yml"

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore OptimizeAll.sln
    - name: Build
      run: dotnet build OptimizeAll.sln --no-restore
    # The test projects run one after another: in parallel the integration hosts and the unit tests compete for the
    # runner's memory, and integration requests then fail at random with transport errors.
    - name: Unit tests
      run: dotnet test tests/OptimizeAll.UnitTests --no-build --verbosity normal
    - name: Integration tests
      run: dotnet test tests/OptimizeAll.IntegrationTests --no-build --verbosity normal
      env:
        OPTIMIZEALL_TEST_PROVIDER: Sqlite
