name: Security

on:
  # Production deploys already run both audits. On pull requests, repeat them only when dependency definitions change.
  pull_request:
    paths:
      - "backend/**/*.csproj"
      - "backend/Directory.Build.props"
      - "backend/Directory.Packages.props"
      - "global.json"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "17 5 * * 1" # weekly, Monday 05:17 UTC: catch newly published advisories
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Dependency review (new vulnerable or disallowed dependencies in this PR)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: NuGet vulnerability audit (fails on high/critical, incl. transitive)
        shell: bash # -eo pipefail: a failing `dotnet list` must fail the step, not be hidden by tee
        run: |
          # `dotnet list package` needs a rooted solution path (relative paths fail with MSB0001).
          sln="$GITHUB_WORKSPACE/backend/OptimizeAll.sln"
          dotnet restore "$sln"
          dotnet list "$sln" package --vulnerable --include-transitive | tee nuget-audit.txt
          if grep -qE '\b(High|Critical)\b' nuget-audit.txt; then
            echo "::error::High or critical NuGet vulnerabilities found (see log above)"
            exit 1
          fi
          if grep -qE '\b(Moderate|Low)\b' nuget-audit.txt; then
            echo "::warning::Moderate/low NuGet vulnerabilities found; schedule an upgrade"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (fails on high/critical)
        working-directory: frontend
        run: npm audit --audit-level=high
