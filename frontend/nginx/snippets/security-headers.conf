# Security headers for the SPA (included in every static location because add_header in a location
# replaces, rather than extends, headers inherited from the server block).
#
# CSP: everything same-origin. The API is reverse-proxied on the same origin, so connect-src 'self' covers it.
#   img-src data:/blob: allow inline icons and local previews of screenshots before upload. Campaign/banner images are
#     uploads served from /api/v1/files/ ('self'). To allow external image hosts, set IMG_SRC_EXTRA on the web container
#     (e.g. IMG_SRC_EXTRA="https://images.example.com https://cdn.example.org"); default.conf.template turns it into
#     $oa_img_src_extra. Keep it identical to the API's Content:AllowedImageHosts (which validates hero, asset and
#     banner image URLs), so every URL the API accepts is also allowed here.
#   Styles are as strict as scripts: same-origin stylesheets, no style attributes, no 'unsafe-inline'. The only inline
#     <style> elements allowed are the ones the page's server lists by hash in X-OA-Style-Hashes ($oa_style_hashes in
#     default.conf.template, which accepts nothing but 'sha256-…' sources and hides the header from the browser): the
#     API document's plain-copy styles and the server renderer's per-page block (the markup's inline styles until the
#     app hydrates; React then sets styles through the CSSOM, which CSP does not restrict). docs/SECURITY.md has the
#     details; src/app/csp.ts builds the same policy for `vite preview` and csp.test.ts keeps the two identical.
#   upgrade-insecure-requests on HTTPS only ($oa_csp_upgrade, like HSTS): plain-http runs would upgrade their own requests.
#   Academy video lectures are hosted on YouTube (docs/LEARNING.md): frame-src allows only the privacy-enhanced embed
#     host https://www.youtube-nocookie.com (loaded on click, behind a thumbnail facade), and img-src allows the
#     thumbnail host https://i.ytimg.com. No YouTube script runs in our page (seek/speed use postMessage).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'$oa_style_hashes; img-src 'self' data: blob: https://i.ytimg.com $oa_img_src_extra; font-src 'self' data:; connect-src 'self'; media-src 'self' blob: $oa_media_src_extra; frame-src 'self' https://www.youtube-nocookie.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'$oa_csp_upgrade" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# HSTS: sent only on HTTPS requests ($oa_hsts in default.conf.template is empty for plain http, and nginx omits a header
# with an empty value). Once browsers see it they refuse plain http for this host for a year. Add includeSubDomains (and
# consider `preload`) only once every subdomain of the domain serves HTTPS.
add_header Strict-Transport-Security $oa_hsts always;
